<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Domain }}/{{ .Package }}</title>
    <meta name="go-import" content="{{ .Domain }}/{{ .Package }} git https://github.com/{{ .GitHubUsername }}/{{ .Package }}.git">
    <meta http-equiv="refresh" content="0; url=https://pkg.go.dev/{{ .Domain }}/{{ .Package }}">
  </head>
  <body>
    <p>The documentation for {{ .Domain }}/{{ .Package }} is on <a href="https://pkg.go.dev/{{ .Domain }}/{{ .Package }}">pkg.go.dev</a>.</p>
  </body>
</html>
